name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # 1. TEST
  # =========================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Tests
        run: |
          pytest


  # =========================
  # 2. BUILD & PUSH DOCKER IMAGE
  # =========================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest


  # =========================
  # 3. DEPLOY TO EC2
  # =========================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "================================"
            echo "Pulling latest Docker image..."
            echo "================================"

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest

            echo "================================"
            echo "Stopping old container..."
            echo "================================"

            docker stop vspire-website || true

            echo "================================"
            echo "Removing old container..."
            echo "================================"

            docker rm vspire-website || true

            echo "================================"
            echo "Starting new container..."
            echo "================================"

            docker run -d \
              --name vspire-website \
              -p 80:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest

            echo "================================"
            echo "Deployment completed!"
            echo "================================"

            docker ps